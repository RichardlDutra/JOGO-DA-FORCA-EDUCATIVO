<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Jogo da Forca - Química e Ciências</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:linear-gradient(180deg,#8b5a2b,#6b3a14);color:#fff;height:100vh;overflow:hidden;padding:10px}
#app{height:100%;max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:8px;position:relative}
h1{text-align:center;font-size:20px;padding:8px;background:linear-gradient(180deg,#e0995a,#a05e28);border-radius:10px;border:3px solid #4a2608}
.tela{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.menu{flex:1;display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:10px 0}
.card{background:linear-gradient(180deg,#c17a3b,#7a4218);border:3px solid #4a2608;border-radius:14px;padding:24px;box-shadow:0 5px 0 #4a2608}
.menu-card{max-width:600px;width:100%;text-align:center}
.menu-card h2{font-size:24px;margin-bottom:18px}
label{display:block;text-align:left;font-size:12px;color:#ffe6c4;font-weight:bold;letter-spacing:1.5px;margin-bottom:5px;margin-top:12px}
select,input,textarea{width:100%;padding:12px;border:3px solid #4a2608;border-radius:10px;background:#fff8e7;color:#3d2415;font-size:15px;font-weight:bold;font-family:inherit}
textarea{resize:vertical;min-height:70px;font-weight:normal}
.btn{padding:14px;border:3px solid #4a2608;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;color:#fff;width:100%;margin-top:8px;text-transform:uppercase;font-family:inherit}
.btn-verde{background:linear-gradient(180deg,#6bcf70,#388e3c);box-shadow:0 5px 0 #1b5e20}
.btn-vermelho{background:linear-gradient(180deg,#ef5350,#b71c1c);box-shadow:0 5px 0 #7f0000}
.btn-azul{background:linear-gradient(180deg,#64b5f6,#1565c0);box-shadow:0 5px 0 #0d47a1}
.btn-amarelo{background:linear-gradient(180deg,#f5c54a,#c98e1e);box-shadow:0 5px 0 #8b5e0a;color:#3d2415}
.btn-roxo{background:linear-gradient(180deg,#b47fe0,#7e3fb8);box-shadow:0 5px 0 #4a1f7a}
.btn-madeira{background:linear-gradient(180deg,#e0995a,#7a4218);box-shadow:0 5px 0 #4a2608}
.btn-laranja{background:linear-gradient(180deg,#ff9a4a,#d9641f);box-shadow:0 5px 0 #8b3a08}
.btn-cinza{background:linear-gradient(180deg,#a0a0a0,#606060);box-shadow:0 5px 0 #303030}
.btn-pequeno{font-size:13px;padding:10px}
.info{font-size:14px;color:#ffe6c4;margin-top:14px}
.jogo{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:0}
.col{display:flex;flex-direction:column;gap:8px;min-height:0}
.forca{flex:1;display:flex;align-items:center;justify-content:center;padding:8px;min-height:0}
.forca svg{width:100%;height:100%;max-height:100%}
.hud{display:flex;justify-content:space-around;padding:8px;background:rgba(0,0,0,.3);border-radius:10px;border:2px solid #4a2608;font-weight:bold;font-size:13px}
.hud .v{color:#e8b83a;font-size:18px}
.dica{background:linear-gradient(180deg,#fdf3dc,#f5e2b8);color:#1a0f08;padding:16px;border-radius:12px;border:3px solid #4a2608}
.dica-t{font-size:11px;color:#7a4218;font-weight:bold;letter-spacing:2px;margin-bottom:6px}
.dica-x{font-size:22px;font-weight:bold;line-height:1.3}
.palavra{flex:1;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.2);border:2px solid #4a2608;border-radius:12px;padding:10px;min-height:80px}
.palavra-x{font-size:clamp(28px,4vw,52px);font-weight:bold;letter-spacing:4px;text-align:center;word-break:break-all;font-family:Georgia,serif}
.ok{color:#0a2540;background:linear-gradient(180deg,#a8e6a8,#6bcf70);padding:2px 10px;border-radius:6px;border:2px solid #1b5e20;display:inline-block;margin:2px;font-family:Georgia,serif;text-shadow:0 1px 0 rgba(255,255,255,.6);box-shadow:0 2px 0 #1b5e20}
.vaz{color:#ffe6c4;opacity:.55;display:inline-block;margin:2px;font-family:Georgia,serif}
.tec{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:8px;background:rgba(0,0,0,.2);border:2px solid #4a2608;border-radius:12px}
.t{padding:10px 0;border:2px solid #4a2608;background:linear-gradient(180deg,#fff8e7,#f0e0c0);color:#3d2415;font-size:16px;font-weight:bold;border-radius:8px;cursor:pointer;font-family:Georgia,serif}
.t:disabled{cursor:not-allowed;opacity:.5}
.t.c{background:linear-gradient(180deg,#a8e6a8,#6bcf70);color:#0a2540;opacity:1}
.t.e{background:linear-gradient(180deg,#ef5350,#b71c1c);color:#fff;opacity:.7}
.lista{max-height:400px;overflow-y:auto;background:rgba(0,0,0,.2);border-radius:10px;padding:10px;margin-top:10px}
.item{display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid rgba(255,255,255,.1);font-size:13px;gap:8px}
.item b{color:#ffe6c4}
.item .del{background:#ef5350;color:#fff;border:2px solid #4a2608;border-radius:6px;padding:4px 10px;cursor:pointer;font-weight:bold;font-size:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{flex:1;min-width:100px;padding:10px;background:rgba(0,0,0,.3);border:2px solid #4a2608;border-radius:10px;cursor:pointer;font-weight:bold;color:#ffe6c4;text-align:center;font-size:13px}
.tab.ativa{background:linear-gradient(180deg,#e0995a,#7a4218);color:#fff}
#overlayFim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:999;align-items:center;justify-content:center;padding:20px}
#overlayFim.ativo{display:flex}
.fim{padding:30px 40px;text-align:center;border:4px solid #4a2608;border-radius:20px;max-width:580px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.6);animation:entrar .3s ease;max-height:92vh;overflow-y:auto}
@keyframes entrar{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.fim.v{background:linear-gradient(180deg,#5cb860,#2e7d32)}
.fim.d{background:linear-gradient(180deg,#e35a5a,#991b1b)}
.fim.aviso{background:linear-gradient(180deg,#c98548,#7a4218)}
.fim .emoji{font-size:60px;margin-bottom:8px}
.fim h2{font-size:30px;margin-bottom:10px;color:#fff}
.fim .sub{font-size:15px;color:#fff;opacity:.9;margin-bottom:12px}
.fim .p{font-size:40px;margin:16px 0;letter-spacing:6px;font-weight:bold;font-family:Georgia,serif;color:#fff;text-shadow:2px 2px 4px rgba(0,0,0,.4);word-break:break-all}
.fim .stats{font-size:15px;color:#fff;margin-bottom:20px}
.fim .btn{margin-top:8px}
@keyframes pop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.3)}100%{transform:scale(1);opacity:1}}
.aluno-box{max-width:640px;width:100%}
.aluno-box h2{font-size:24px;margin-bottom:10px;text-align:center}
.aluno-box p{color:#ffe6c4;font-size:14px;margin-bottom:16px;line-height:1.5;text-align:center}
.linha-add{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.linha-add .btn{margin-top:0;width:auto;padding:12px 20px;white-space:nowrap}
.alunos-lista{background:rgba(0,0,0,.25);border-radius:10px;padding:10px;margin-top:14px;max-height:220px;overflow-y:auto}
.aluno-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(255,248,231,.1);border-radius:8px;margin-bottom:6px;font-size:14px;font-weight:bold}
.aluno-item .num{background:#c98548;color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;margin-right:10px}
.aluno-item .nome{flex:1;text-align:left}
.aluno-item .del{background:#ef5350;color:#fff;border:2px solid #4a2608;border-radius:6px;padding:3px 9px;cursor:pointer;font-size:12px;font-weight:bold}
.vazio-lista{text-align:center;color:#ffe6c4;font-size:13px;font-style:italic;padding:14px}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.times-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.time-box{border-radius:14px;padding:16px;border:4px solid #4a2608;min-height:180px}
.time-a{background:linear-gradient(180deg,#64b5f6,#0d47a1)}
.time-b{background:linear-gradient(180deg,#ef5350,#b71c1c)}
.time-box h3{font-size:18px;text-align:center;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid rgba(255,255,255,.3);letter-spacing:1px}
.time-box .jogador{padding:8px 12px;background:rgba(0,0,0,.25);border-radius:8px;margin-bottom:6px;font-size:14px;font-weight:bold;display:flex;justify-content:space-between;align-items:center}
.time-box .jogador .pos{background:rgba(255,255,255,.25);width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px}
.time-box .vazio{text-align:center;font-style:italic;opacity:.7;padding:20px;font-size:13px}
.time-info{text-align:center;font-size:13px;color:#ffe6c4;margin-top:12px}
.placar-times{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.time-placar{padding:10px;border-radius:10px;border:3px solid #4a2608;text-align:center;font-weight:bold}
.time-placar.a{background:linear-gradient(180deg,#64b5f6,#0d47a1)}
.time-placar.b{background:linear-gradient(180deg,#ef5350,#b71c1c)}
.time-placar.ativo{box-shadow:0 0 0 4px #e8b83a, 0 0 20px #e8b83a}
.time-placar .nome{font-size:12px;letter-spacing:1px;opacity:.9}
.time-placar .pts{font-size:26px;font-family:Georgia,serif;margin-top:2px}
.acoes-jogo{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:6px}
.acoes-jogo .btn{margin-top:0;font-size:13px;padding:10px}
.reg-card{max-width:1200px;width:100%;padding:20px}
.reg-filtros{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-bottom:14px}
@media(max-width:900px){.reg-filtros{grid-template-columns:1fr 1fr}}
.reg-tabela{max-height:360px;overflow-y:auto;background:#fff8e7;border-radius:10px;border:3px solid #4a2608}
.reg-tabela table{width:100%;border-collapse:collapse;font-size:13px;color:#3d2415}
.reg-tabela th{background:#a05e28;color:#fff;padding:10px;text-align:left;position:sticky;top:0;font-size:11px;text-transform:uppercase;letter-spacing:1px}
.reg-tabela td{padding:8px 10px;border-bottom:1px solid rgba(122,66,24,.2)}
.reg-tabela tr{cursor:pointer;transition:background .15s}
.reg-tabela tbody tr:hover{background:#e8d5a8}
.reg-tabela .acerto{color:#1b5e20;font-weight:bold}
.reg-tabela .erro{color:#7f0000;font-weight:bold}
.reg-tabela .time-a{color:#0d47a1;font-weight:bold}
.reg-tabela .time-b{color:#b71c1c;font-weight:bold}
.reg-tabela .ver-mais{color:#0d47a1;font-weight:bold;font-size:11px;text-decoration:underline}
.reg-resumo{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.reg-stat{background:#fff8e7;border:3px solid #4a2608;border-radius:10px;padding:12px;text-align:center}
.reg-stat .num{font-size:24px;font-weight:bold;color:#7a4218}
.reg-stat .lbl{font-size:10px;color:#7a4218;font-weight:bold;letter-spacing:1px;margin-top:2px}
.teclado-aviso{background:rgba(255,255,255,.15);padding:6px 10px;border-radius:8px;font-size:11px;color:#ffe6c4;text-align:center;margin-top:6px;font-weight:bold;letter-spacing:.5px}
.palavras-info{background:rgba(100,150,255,.25);padding:5px 10px;border-radius:8px;font-size:11px;color:#e0f0ff;text-align:center;font-weight:bold;letter-spacing:.5px;border:1px solid rgba(100,150,255,.4)}
#modalConfirm{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;align-items:center;justify-content:center;padding:20px}
#modalConfirm.ativo{display:flex}
.modal-box{background:linear-gradient(180deg,#c17a3b,#7a4218);border:4px solid #4a2608;border-radius:20px;padding:32px;max-width:640px;width:100%;text-align:center;box-shadow:0 15px 40px rgba(0,0,0,.7);animation:entrar .25s ease;max-height:92vh;overflow-y:auto}
.modal-box.modal-grande{max-width:1000px}
.modal-box .icone{font-size:56px;margin-bottom:12px}
.modal-box h2{font-size:24px;color:#fff;margin-bottom:12px}
.modal-box p{color:#ffe6c4;font-size:15px;line-height:1.5;margin-bottom:20px}
.modal-box .resumo{background:rgba(0,0,0,.3);border-radius:10px;padding:14px;margin-bottom:18px;font-size:14px;text-align:left;color:#fff;line-height:1.6}
.modal-box .resumo b{color:#ffe6c4}
.modal-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-btns .btn{margin-top:0}
.detalhe-box{max-width:800px}
.detalhe-header{background:rgba(0,0,0,.3);border-radius:12px;padding:14px;margin-bottom:16px;text-align:left;font-size:13px;line-height:1.7;color:#fff}
.detalhe-times{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.detalhe-time{border-radius:12px;padding:14px;border:3px solid #4a2608}
.detalhe-time.a{background:linear-gradient(180deg,#64b5f6,#0d47a1)}
.detalhe-time.b{background:linear-gradient(180deg,#ef5350,#b71c1c)}
.detalhe-time h3{font-size:15px;text-align:center;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid rgba(255,255,255,.3);letter-spacing:1px}
.detalhe-time .pontos{text-align:center;font-size:28px;font-weight:bold;font-family:Georgia,serif;margin-bottom:10px}
.detalhe-time .aluno-det{background:rgba(0,0,0,.25);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.detalhe-time .aluno-det .nome{font-weight:bold;flex:1}
.detalhe-time .aluno-det .res{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:bold}
.detalhe-time .aluno-det .res.ok{background:#1b5e20;color:#fff}
.detalhe-time .aluno-det .res.no{background:#7f0000;color:#fff}
.detalhe-time .aluno-det .res.int{background:#8b5e0a;color:#fff}

/* EXPORTAÇÃO */
.export-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.export-preview{background:#fff8e7;border:3px solid #4a2608;border-radius:10px;padding:12px;max-height:300px;overflow:auto;color:#3d2415;font-size:12px;text-align:left}
.export-preview table{width:100%;border-collapse:collapse}
.export-preview th{background:#a05e28;color:#fff;padding:6px 8px;text-align:left;font-size:11px;position:sticky;top:0}
.export-preview td{padding:5px 8px;border-bottom:1px solid #ddd}
.export-btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.export-btn-row .btn{margin-top:0}

/* NOTAS */
.nota-badge{display:inline-block;padding:4px 12px;border-radius:8px;font-weight:bold;font-size:14px}
.nota-otima{background:#1b5e20;color:#fff}
.nota-boa{background:#388e3c;color:#fff}
.nota-regular{background:#f5c54a;color:#3d2415}
.nota-baixa{background:#ef5350;color:#fff}
.nota-input{width:70px;padding:6px;border:2px solid #4a2608;border-radius:6px;text-align:center;font-weight:bold;background:#fff}
</style>
</head>
<body>

<div id="app"></div>
<div id="overlayFim"></div>
<div id="modalConfirm"></div>

<script>
/* ============================================================
   BANCO DE PALAVRAS
   ============================================================ */
var PALAVRAS_PADRAO = [
  /* ===== 1º ANO - QUÍMICA ===== */
  {turma:"1º Ano", disc:"Química", p:"PRÓTON", d:"Partícula de carga positiva localizada no núcleo do átomo."},
  {turma:"1º Ano", disc:"Química", p:"THOMSON", d:"Nome do modelo atômico conhecido como pudim de passas."},
  {turma:"1º Ano", disc:"Química", p:"NÚCLEO", d:"Região central do átomo que concentra quase toda a sua massa."},
  {turma:"1º Ano", disc:"Química", p:"MENDELEEV", d:"Nome do cientista que organizou a primeira versão da tabela periódica atual."},
  {turma:"1º Ano", disc:"Química", p:"ELETRONEGATIVIDADE", d:"Força ou tendência de um átomo para atrair elétrons na ligação."},
  {turma:"1º Ano", disc:"Química", p:"ÂNION", d:"Átomo que ganhou elétrons e ficou com carga negativa."},
  {turma:"1º Ano", disc:"Química", p:"QUARKS", d:"Subpartículas fundamentais que formam os prótons e os nêutrons."},
  {turma:"1º Ano", disc:"Química", p:"ÍON", d:"Átomo que possui carga elétrica por perder ou ganhar elétrons."},
  {turma:"1º Ano", disc:"Química", p:"PERÍODOS", d:"Linhas horizontais da tabela periódica que indicam as camadas eletrônicas."},
  {turma:"1º Ano", disc:"Química", p:"CÁTION", d:"Átomo que perdeu elétrons e ficou com carga positiva."},
  {turma:"1º Ano", disc:"Química", p:"FLÚOR", d:"Elemento mais eletronegativo de toda a tabela periódica."},
  {turma:"1º Ano", disc:"Química", p:"DALTON", d:"Nome do modelo atômico conhecido como bola de bilhar."},
  {turma:"1º Ano", disc:"Química", p:"MOLÉCULA", d:"Agrupamento de átomos eletricamente neutros ligados entre si."},
  {turma:"1º Ano", disc:"Química", p:"ISÓTOPOS", d:"Átomos que possuem o mesmo número de prótons, mas massas diferentes."},
  {turma:"1º Ano", disc:"Química", p:"ELÉTRON", d:"Partícula com carga elétrica negativa que fica girando na eletrosfera."},
  {turma:"1º Ano", disc:"Química", p:"BOHR", d:"Modelo atômico planetário que introduziu as órbitas de energia."},
  {turma:"1º Ano", disc:"Química", p:"ÁTOMO", d:"Menor unidade fundamental da matéria que mantém as propriedades de um elemento."},
  {turma:"1º Ano", disc:"Química", p:"FAMÍLIAS", d:"Colunas verticais da tabela periódica com elementos de propriedades parecidas."},
  {turma:"1º Ano", disc:"Química", p:"RUTHERFORD", d:"Modelo atômico que descobriu o núcleo fazendo o experimento do ouro."},
  {turma:"1º Ano", disc:"Química", p:"SUBLIMAÇÃO", d:"Mudança direta do estado sólido para o estado gasoso."},
  {turma:"1º Ano", disc:"Química", p:"COVALENTE", d:"Ligação química baseada no compartilhamento de elétrons."},
  {turma:"1º Ano", disc:"Química", p:"IÔNICA", d:"Ligação baseada na atração elétrica entre cátions e ânions."},
  {turma:"1º Ano", disc:"Química", p:"DENSIDADE", d:"Propriedade da matéria que mede a quantidade de massa em um certo volume."},
  {turma:"1º Ano", disc:"Química", p:"NOBRES", d:"Elementos químicos da última coluna da tabela que são muito estáveis."},
  {turma:"1º Ano", disc:"Química", p:"ELASTICIDADE", d:"Capacidade de um material retornar à forma original após sofrer deformação."},
  {turma:"1º Ano", disc:"Química", p:"CONDENSAÇÃO", d:"Mudança do estado gasoso para o estado líquido."},
  {turma:"1º Ano", disc:"Química", p:"HOMOGÊNEA", d:"Mistura que apresenta uma única fase visível."},
  {turma:"1º Ano", disc:"Química", p:"DESTILAÇÃO", d:"Processo de separação de misturas baseado na diferença de pontos de ebulição."},
  {turma:"1º Ano", disc:"Química", p:"ATÔMICO", d:"Número que indica a quantidade de prótons existentes no núcleo de um átomo."},
  {turma:"1º Ano", disc:"Química", p:"ISÓBAROS", d:"Átomos que possuem o mesmo número de massa e diferentes números de prótons."},

  /* ===== 2º ANO - QUÍMICA ===== */
  {turma:"2º Ano", disc:"Química", p:"DILUIÇÃO", d:"Adicionar solvente puro para diminuir a concentração da solução."},
  {turma:"2º Ano", disc:"Química", p:"EXOTÉRMICA", d:"Reação química que libera calor para o ambiente."},
  {turma:"2º Ano", disc:"Química", p:"REAGENTES", d:"Substâncias iniciais que ficam antes da seta na equação."},
  {turma:"2º Ano", disc:"Química", p:"SOLVENTE", d:"Componente em maior quantidade que dissolve o soluto."},
  {turma:"2º Ano", disc:"Química", p:"TONOSCOPIA", d:"Propriedade coligativa que estuda o abaixamento da pressão de vapor."},
  {turma:"2º Ano", disc:"Química", p:"ENDOTÉRMICA", d:"Reação química que absorve calor do ambiente."},
  {turma:"2º Ano", disc:"Química", p:"TENTATIVAS", d:"Nome do método mais básico de balanceamento químico."},

function getTurmas(){

function formatarData(iso){
  var d = new Date(iso);
  return String(d.getDate()).padStart(2,"0") + "/" +
         String(d.getMonth()+1).padStart(2,"0") + "/" +
         d.getFullYear() + " " +
         String(d.getHours()).padStart(2,"0") + ":" +
         String(d.getMinutes()).padStart(2,"0");
}

  var d = new Date(iso);

}

}
function shuffle(arr){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = a[j]; j = tmp;
  }
  return a;
}
function gerarRodadaId(){

function baixarArquivo(nome, conteudo, tipo){
  var blob = new Blob(["\uFEFF" + conteudo], {type: tipo || "text/csv;charset=utf-8;"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = nome;
  a.click();
  URL.revokeObjectURL(url);
}
function copiarParaClipboard(texto){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(texto).then(function(){
      alert("✅ Copiado! Cole no Excel ou Google Sheets (Ctrl+V)");
    }).catch(function(){
      fallbackCopiar(texto);
    });
  } else {
    fallbackCopiar(texto);
  }
}
function fallbackCopiar(texto){
  var ta = document.createElement("textarea");
  ta.value = texto;
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.select();
  try{
    document.execCommand("copy");
    alert("✅ Copiado! Cole no Excel ou Google Sheets (Ctrl+V)");
  }catch(e){
    alert("❌ Não foi possível copiar. Tente exportar CSV.");
  }
  document.body.removeChild(ta);
}

function sortearPalavra(){
  var todas = [];
  for(var i=0;i<PALAVRAS.length;i++){
    if(PALAVRAS[i].turma === turmaRodada && PALAVRAS[i].disc === discRodada) todas.push(PALAVRAS[i]);
  }
  if(todas.length === 0) return null;
  var naoUsadas = [];
  for(var j=0;j<todas.length;j++){
    if(palavrasUsadasRodada.indexOf(todas[j].p) === -1) naoUsadas.push(todas[j]);
  }
  if(naoUsadas.length > 0){
    var escolhida = naoUsadas[Math.floor(Math.random() * naoUsadas.length)];
    palavrasUsadasRodada.push(escolhida.p);
    return escolhida;
  }
  var ultimaUsada = palavrasUsadasRodada[palavrasUsadasRodada.length - 1];
  var disponiveisReset = [];
  for(var k=0;k<todas.length;k++){
    if(todas[k].p !== ultimaUsada) disponiveisReset.push(todas[k]);
  }
  if(disponiveisReset.length === 0) disponiveisReset = todas;
  var novaEscolha = disponiveisReset[Math.floor(Math.random() * disponiveisReset.length)];
  palavrasUsadasRodada = [novaEscolha.p];
  return novaEscolha;
}

function tecladoFisicoHandler(e){
  if(!jogo.palavra) return;
  if(jogo.finalizado) return;
  var tag = (e.target.tagName || "").toLowerCase();
  if(tag === "input" || tag === "textarea" || tag === "select") return;
  if(e.ctrlKey || e.altKey || e.metaKey) return;
  var letra = (e.key || "").toUpperCase();
  if(!/^[A-Z]$/.test(letra)) return;
  e.preventDefault();
  jogarLetra(letra);
}

function sortearTimes(){
  var aviso = $("avisoAluno");
  aviso.innerHTML = "";
  var todos = timeA.slice();
  if(todos.length < 2){
    aviso.innerHTML = '<div style="background:rgba(251,191,36,.2);color:#fde68a;padding:10px;border-radius:8px;font-size:14px;font-weight:bold">⚠️ Adicione pelo menos 2 alunos</div>';
    return;
  }
  var opcoes = [];
  for(var i=0;i<PALAVRAS.length;i++){
    if(PALAVRAS[i].turma === turmaRodada && PALAVRAS[i].disc === discRodada) opcoes.push(PALAVRAS[i]);
  }
  if(opcoes.length === 0){
    aviso.innerHTML = '<div style="background:rgba(251,191,36,.2);color:#fde68a;padding:10px;border-radius:8px;font-size:14px;font-weight:bold">⚠️ Nenhuma palavra cadastrada</div>';
    return;
  }
  var embaralhados = shuffle(todos);
  timeA = []; timeB = [];
  for(var k=0; k<embaralhados.length; k++){
    if(k % 2 === 0) timeA.push(embaralhados[k]);
    else timeB.push(embaralhados[k]);
  }
  filaRodada = [];
  var maxLen = Math.max(timeA.length, timeB.length);
  for(var m=0; m<maxLen; m++){
    if(m < timeA.length) filaRodada.push({nome: timeA[m], time: "A"});
    if(m < timeB.length) filaRodada.push({nome: timeB[m], time: "B"});
  }
  pontosA = 0; pontosB = 0;
  indiceAlunoAtual = 0;
  palavrasUsadasRodada = [];
  mostrarTimesFormados();
}

function atualizarPalavra(primeira){
  var cont = $("palavraSlots");
  if(!cont) return;
  var novas = jogo.certas.filter(function(l){ return ultimasCertas.indexOf(l) === -1; });
  ultimasCertas = jogo.certas.slice();
  var html = "";
  for(var i = 0; i < jogo.palavra.length; i++){
    var l = jogo.palavra[i];
    if(l === " "){ html += '<span style="display:inline-block;width:20px">&nbsp;</span>'; }
    else if(jogo.certas.indexOf(semAcento(l)) !== -1){
      var anim = !primeira && novas.indexOf(semAcento(l)) !== -1;
      html += '<span class="ok"' + (anim ? ' style="animation:pop .5s ease"' : '') + '>' + l + '</span>';
    } else {
      html += '<span class="vaz">_</span>';
    }
  }
  cont.innerHTML = html;
}

function atualizarTeclado(){
  var t = $("teclado");
  if(!t) return;
  var h = "";
  "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(function(l){
    var c = "t", d = "";
    if(jogo.certas.indexOf(l) !== -1){ c += " c"; d = " disabled"; }
    else if(jogo.erradas.indexOf(l) !== -1){ c += " e"; d = " disabled"; }
    else if(jogo.finalizado){ d = " disabled"; }
    h += '<button class="' + c + '" data-l="' + l + '"' + d + '>' + l + '</button>';
  });
  t.innerHTML = h;
  var btns = t.querySelectorAll("button");
  for(var i = 0; i < btns.length; i++){
    btns[i].onclick = function(){ jogarLetra(this.getAttribute("data-l")); };
  }
}

function jogarLetra(l){
  if(jogo.finalizado) return;
  if(jogo.certas.indexOf(l) !== -1 || jogo.erradas.indexOf(l) !== -1) return;
  var acertou = false;
  for(var i = 0; i < jogo.palavra.length; i++){
    if(semAcento(l) === semAcento(jogo.palavra[i])){ acertou = true; break; }
  }
  if(acertou){
    jogo.certas.push(l);
    atualizarPalavra(false);
  } else {
    jogo.erradas.push(l);
    jogo.erros++;
    $("erros").textContent = jogo.erros;
    var partes = ["cabeca","corpo","braco-esq","braco-dir","perna-esq","perna-dir"];
    var el = document.getElementById("parte-" + partes[jogo.erros - 1]);
    if(el){ el.style.opacity = "1"; el.style.transform = "scale(1)"; }
    atualizarPalavra(true);
  }
  atualizarTeclado();
  verificarFim();
}

function verificarFim(){
  var s = jogo.palavra.replace(/\s/g,"");
  var u = [];
  for(var i = 0; i < s.length; i++){
    var l = semAcento(s[i]);
    if(u.indexOf(l) === -1) u.push(l);
  }
  var todas = true;
  for(var j = 0; j < u.length; j++){
    if(jogo.certas.indexOf(u[j]) === -1){ todas = false; break; }
  }
  if(todas){
    jogo.finalizado = true;
    jogo.acertos++;
    if(jogo.time === "A") pontosA++;
    else pontosB++;
    $("acertos").textContent = jogo.acertos;
    registrarJogada(true);
    atualizarTeclado();
    mostrarFimAluno(true);
  } else if(jogo.erros >= 6){
    jogo.finalizado = true;
    jogo.certas = u.slice();
    atualizarPalavra(true);
    atualizarTeclado();
    registrarJogada(false);
    mostrarFimAluno(false);
  }
}

function registrarJogada(acertou){
  REGISTROS.push({
    id: Date.now() + "_" + Math.random().toString(36).substr(2,5),
    rodadaId: jogo.rodadaId,
    aluno: jogo.aluno,
    time: jogo.time,
    turma: jogo.turma,
    disc: jogo.disc,
    palavra: jogo.palavra,
    dica: jogo.dica,
    acertou: acertou,
    erros: jogo.erros,
    data: new Date().toISOString()
  });
  salvarRegistros();
}

    '<div class="p">' + jogo.palavra + '</div>' +
    '<div class="stats">Erros: ' + jogo.erros + '/6' + (v ? ' | +1 ponto para ' + nomeTime : '') + '</div>' +
    '<div style="background:rgba(0,0,0,.3);padding:12px;border-radius:10px;margin-bottom:12px;font-weight:bold">' +
    '🔵 Time Azul: ' + pontosA + ' &nbsp;&nbsp; | &nbsp;&nbsp; 🔴 Time Vermelho: ' + pontosB +
    '</div>';

  if(temProximo){
    var corProx = proximo.time === "A" ? "#64b5f6" : "#ef5350";
    var nomeTimeProx = proximo.time === "A" ? "TIME AZUL" : "TIME VERMELHO";
    html += '<div style="background:' + corProx + ';padding:12px;border-radius:10px;margin-bottom:12px;font-weight:bold">' +
      '👤 Próximo: <span style="color:#fff">' + proximo.nome + '</span> (' + nomeTimeProx + ')</div>' +
      '<button class="btn btn-verde" onclick="proximoAluno()">➡️ CHAMAR PRÓXIMO</button>' +
      '<button class="btn btn-laranja" onclick="confirmarEncerramento()">⏹️ ENCERRAR RODADA AGORA</button>';
  } else {
    html += '<div style="background:rgba(232,184,58,.3);padding:14px;border-radius:10px;margin-bottom:12px;font-weight:bold;font-size:16px">' +
      '🏁 FIM DE RODADA!<br><br>' +
      '🔵 Time Azul: <b>' + pontosA + '</b> ponto(s)<br>' +
      '🔴 Time Vermelho: <b>' + pontosB + '</b> ponto(s)<br><br>' +
      (pontosA > pontosB ? '🏆 VENCEDOR: TIME AZUL!' : (pontosB > pontosA ? '🏆 VENCEDOR: TIME VERMELHO!' : '🤝 EMPATE!')) +
      '</div>' +
      '<button class="btn btn-azul" onclick="telaRegistros()">📊 VER REGISTROS</button>' +
      '<button class="btn btn-verde" onclick="telaMenu()">🏠 VOLTAR AO MENU</button>';
  }

  html += '</div>';
  ov.innerHTML = html;
  ov.classList.add("ativo");
}

function proximoAluno(){
  indiceAlunoAtual++;
  $("overlayFim").classList.remove("ativo");
  iniciarPartidaAlunoAtual();
}

function confirmarEncerramento(){
  $("overlayFim").classList.remove("ativo");
  var jogadoresProcessados = indiceAlunoAtual + (jogo.palavra && !jogo.finalizado ? 1 : 0);
  if(jogo.finalizado) jogadoresProcessados = indiceAlunoAtual + 1;
  var restantes = filaRodada.length - jogadoresProcessados;
  var emAndamento = jogo.palavra && !jogo.finalizado ? 1 : 0;

  var html = '<div class="modal-box">' +
    '<div class="icone">⏹️</div>' +
    '<h2>ENCERRAR RODADA?</h2>' +
    '<p>Os pontos conquistados até agora serão mantidos e salvos.</p>' +
    '<div class="resumo">' +
    '<b>📊 Situação atual:</b><br><br>' +
    '🔵 Time Azul: <b>' + pontosA + '</b> ponto(s)<br>' +
    '🔴 Time Vermelho: <b>' + pontosB + '</b> ponto(s)<br><br>' +
    '👥 Alunos que jogaram: <b>' + jogadoresProcessados + ' de ' + filaRodada.length + '</b><br>' +
    (restantes > 0 ? '⏱️ Ainda faltam <b>' + restantes + '</b> aluno(s) jogar' : '✅ Todos já jogaram') +
    (emAndamento ? '<br><br>⚠️ A partida atual de <b>' + jogo.aluno + '</b> será salva como <b>interrompida</b>.' : '') +
    '</div>' +
    '<div class="modal-btns">' +
    '<button class="btn btn-madeira" onclick="fecharModal()">⬅️ CONTINUAR JOGANDO</button>' +
    '<button class="btn btn-vermelho" onclick="executarEncerramento()">⏹️ ENCERRAR AGORA</button>' +
    '</div>' +
    '</div>';
  abrirModal(html);
}

function executarEncerramento(){
  fecharModal();
  if(jogo.palavra && !jogo.finalizado && jogo.aluno){
    REGISTROS.push({
      id: Date.now() + "_" + Math.random().toString(36).substr(2,5),
      rodadaId: jogo.rodadaId,
      aluno: jogo.aluno,
      time: jogo.time,
      turma: jogo.turma,
      disc: jogo.disc,
      palavra: jogo.palavra,
      dica: jogo.dica,
      acertou: false,
      erros: jogo.erros,
      interrompida: true,
      data: new Date().toISOString()
    });
    salvarRegistros();
  }
  jogo.finalizado = true;
  jogo.palavra = "";
  mostrarResumoEncerramento();
}

function mostrarResumoEncerramento(){
  var ov = $("overlayFim");
  var jogadoresProcessados = indiceAlunoAtual + 1;
  if(jogo.aluno && !jogo.palavra) jogadoresProcessados = indiceAlunoAtual + 1;
  var restantes = filaRodada.length - jogadoresProcessados;
  if(restantes < 0) restantes = 0;

  var vencedor = "";
  if(pontosA > pontosB) vencedor = "🏆 VENCEDOR: TIME AZUL!";
  else if(pontosB > pontosA) vencedor = "🏆 VENCEDOR: TIME VERMELHO!";
  else if(pontosA === 0 && pontosB === 0) vencedor = "🤝 Nenhum ponto ainda";
  else vencedor = "🤝 EMPATE!";

  var html = '<div class="fim aviso">' +
    '<div class="emoji">⏹️</div>' +
    '<h2>RODADA ENCERRADA</h2>' +
    '<div class="sub">A rodada foi encerrada manualmente.</div>' +
    '<div style="background:rgba(0,0,0,.35);padding:16px;border-radius:12px;margin:14px 0;font-weight:bold;font-size:16px;line-height:1.6">' +
    '🔵 Time Azul: <b>' + pontosA + '</b> ponto(s)<br>' +
    '🔴 Time Vermelho: <b>' + pontosB + '</b> ponto(s)<br><br>' +
    '<span style="color:#ffe6c4">' + vencedor + '</span>' +
    '</div>' +
    '<div style="background:rgba(0,0,0,.25);padding:12px;border-radius:10px;margin-bottom:14px;font-size:13px;color:#fff">' +
    '👥 Jogaram: <b>' + jogadoresProcessados + '</b> de ' + filaRodada.length + ' alunos' +
    (restantes > 0 ? '<br>⏱️ Faltaram: <b>' + restantes + '</b> aluno(s)' : '<br>✅ Todos jogaram') +
    '</div>' +
    '<button class="btn btn-azul" onclick="telaRegistros()">📊 VER REGISTROS</button>' +
    '<button class="btn btn-verde" onclick="telaMenu()">🏠 VOLTAR AO MENU</button>' +
    '</div>';
  ov.innerHTML = html;
  ov.classList.add("ativo");
}

function mudarAbaExport(aba){ exportAba = aba; telaRegistros(); }

function filtrarRegistros(){
  var data = $("filtroData") ? $("filtroData").value : "";
  var dataFim = $("filtroDataFim") ? $("filtroDataFim").value : "";
  var turma = $("filtroTurma") ? $("filtroTurma").value : "";
  var nome = $("filtroNome") ? $("filtroNome").value : "";
  var out = [];
  for(var i=0;i<REGISTROS.length;i++){
    var r = REGISTROS[i];
    var d = dataParaInput(r.data);
    if(data && d < data) continue;
    if(dataFim && d > dataFim) continue;
    if(turma && r.turma !== turma) continue;
    if(nome && r.aluno !== nome) continue;
    out.push(r);
  }
  out.sort(function(a,b){ return b.data.localeCompare(a.data); });
  return out;
}

function renderResumo(lista){
  var acertos = 0, interrompidas = 0;
  for(var i=0;i<lista.length;i++){
    if(lista[i].interrompida) interrompidas++;
    else if(lista[i].acertou) acertos++;
  }
  var total = lista.length;
  var erros = total - acertos - interrompidas;
  var validas = total - interrompidas;
  var aprov = validas > 0 ? Math.round(acertos/validas*100) : 0;

  $("resumoReg").innerHTML =
    '<div class="reg-stat"><div class="num">' + total + '</div><div class="lbl">PARTIDAS</div></div>' +
    '<div class="reg-stat"><div class="num" style="color:#1b5e20">' + acertos + '</div><div class="lbl">ACERTOS</div></div>' +
    '<div class="reg-stat"><div class="num" style="color:#7f0000">' + erros + '</div><div class="lbl">ERROS</div></div>' +
    '<div class="reg-stat"><div class="num" style="color:#0d47a1">' + aprov + '%</div><div class="lbl">APROVEIT.</div></div>';
}

function renderRegistros(){
  var lista = filtrarRegistros();
  renderResumo(lista);
  var el = $("conteudoExport");
  if(!el) return;
  if(exportAba === "tabela") el.innerHTML = montarTabelaCompleta(lista);
  else if(exportAba === "notas") el.innerHTML = montarNotasPorAluno(lista);
  else if(exportAba === "data") el.innerHTML = montarPorData(lista);
  else if(exportAba === "rodadas") el.innerHTML = montarPorRodada(lista);
}

/* ===== ABA 1: TABELA COMPLETA ===== */

/* ===== ABA 2: NOTAS POR ALUNO ===== */
function montarNotasPorAluno(lista){
  var porAluno = {};
  for(var i=0;i<lista.length;i++){
    var r = lista[i];
    if(!porAluno[r.aluno]){
      porAluno[r.aluno] = {nome: r.aluno, turma: r.turma, total: 0, acertos: 0, erros: 0, interrompidas: 0, errosLetras: 0};
    }
    var a = porAluno[r.aluno];
    a.total++;
    if(r.interrompida) a.interrompidas++;
    else if(r.acertou) a.acertos++;
    else a.erros++;
    a.errosLetras += r.erros;
  }
  var arr = [];
  for(var k in porAluno) arr.push(porAluno[k]);
  arr.sort(function(a,b){ return a.nome.localeCompare(b.nome); });

  if(arr.length === 0){
    return '<div style="color:#ffe6c4;text-align:center;padding:20px;font-style:italic">Nenhum aluno nos filtros selecionados</div>';
  }

  var html = '<div style="color:#ffe6c4;font-size:13px;margin-bottom:8px;text-align:center;font-weight:bold">' +
    '💡 Resumo por aluno — pronto para lançamento de notas' +
    '</div>' +
    '<div class="reg-tabela"><table><thead><tr>' +
    '<th>Aluno</th><th>Turma</th><th>Partidas</th><th>Acertos</th><th>Erros</th><th>Aproveit.</th><th>Erros em Letras</th><th>Sugestão</th>' +
    '</tr></thead><tbody>';
  for(var j=0;j<arr.length;j++){
    var a = arr[j];
    var validas = a.acertos + a.erros;
    var aprov = validas > 0 ? Math.round(a.acertos/validas*100) : 0;
    var notaCls = "", notaTxt = "";
    if(validas === 0){ notaCls = "nota-regular"; notaTxt = "—"; }
    else if(aprov >= 90){ notaCls = "nota-otima"; notaTxt = "Excelente"; }
    else if(aprov >= 70){ notaCls = "nota-boa"; notaTxt = "Bom"; }
    else if(aprov >= 50){ notaCls = "nota-regular"; notaTxt = "Regular"; }
    else { notaCls = "nota-baixa"; notaTxt = "Atenção"; }

    html += '<tr style="cursor:default">' +
      '<td><b>' + a.nome + '</b></td>' +
      '<td>' + a.turma + '</td>' +
      '<td>' + a.total + (a.interrompidas > 0 ? ' <span style="color:#8b5e0a;font-size:11px">(' + a.interrompidas + ' int.)</span>' : '') + '</td>' +
      '<td style="color:#1b5e20;font-weight:bold">' + a.acertos + '</td>' +
      '<td style="color:#7f0000;font-weight:bold">' + a.erros + '</td>' +
      '<td><b>' + aprov + '%</b></td>' +
      '<td>' + a.errosLetras + '</td>' +
      '<td><span class="nota-badge ' + notaCls + '">' + notaTxt + '</span></td>' +
      '</tr>';
  }
  html += '</tbody></table></div>';
  return html;
}

/* ===== ABA 3: POR DATA ===== */
function montarPorData(lista){
  var porData = {};
  for(var i=0;i<lista.length;i++){
    var r = lista[i];
    var dia = dataParaInput(r.data);
    if(!porData[dia]){
      porData[dia] = {dia: dia, total: 0, acertos: 0, erros: 0, alunos: [], turmas: []};
    }
    var d = porData[dia];
    d.total++;
    if(!r.interrompida){
      if(r.acertou) d.acertos++;
      else d.erros++;
    }
    if(d.alunos.indexOf(r.aluno) === -1) d.alunos.push(r.aluno);
    if(d.turmas.indexOf(r.turma) === -1) d.turmas.push(r.turma);
  }
  var arr = [];
  for(var k in porData) arr.push(porData[k]);
  arr.sort(function(a,b){ return b.dia.localeCompare(a.dia); });

  if(arr.length === 0){
    return '<div style="color:#ffe6c4;text-align:center;padding:20px;font-style:italic">Nenhum registro encontrado</div>';
  }

  var html = '<div style="color:#ffe6c4;font-size:13px;margin-bottom:8px;text-align:center;font-weight:bold">' +
    '💡 Resumo por data — clique para ver todos os registros daquele dia' +
    '</div>' +
    '<div class="reg-tabela"><table><thead><tr>' +
    '<th>Data</th><th>Total</th><th>Acertos</th><th>Erros</th><th>Aproveit.</th><th>Alunos</th><th>Turmas</th><th></th>' +
    '</tr></thead><tbody>';
  for(var j=0;j<arr.length;j++){
    var d = arr[j];
    var validas = d.acertos + d.erros;
    var aprov = validas > 0 ? Math.round(d.acertos/validas*100) : 0;
    var [ano, mes, dia] = d.dia.split("-");
    var dataBr = dia + "/" + mes + "/" + ano;
    html += '<tr onclick="verRegistrosDaData(\'' + d.dia + '\')">' +
      '<td><b>' + dataBr + '</b></td>' +
      '<td>' + d.total + '</td>' +
      '<td style="color:#1b5e20;font-weight:bold">' + d.acertos + '</td>' +
      '<td style="color:#7f0000;font-weight:bold">' + d.erros + '</td>' +
      '<td><b>' + aprov + '%</b></td>' +
      '<td>' + d.alunos.length + '</td>' +
      '<td>' + d.turmas.join(", ") + '</td>' +
      '<td class="ver-mais">👁️ Ver</td>' +
      '</tr>';
  }
  html += '</tbody></table></div>';
  return html;
}

/* ===== ABA 4: POR RODADA ===== */
function montarPorRodada(lista){
  var rodadas = agruparPorRodada(lista);
  if(rodadas.length === 0){
    return '<div style="color:#ffe6c4;text-align:center;padding:20px;font-style:italic">Nenhuma rodada encontrada</div>';
  }
  var html = '<div style="color:#ffe6c4;font-size:13px;margin-bottom:8px;text-align:center;font-weight:bold">' +
    '💡 Clique em qualquer rodada para ver os detalhes completos' +
    '</div>' +
    '<div class="reg-tabela"><table><thead><tr>' +
    '<th>Data/Hora</th><th>Turma</th><th>Partidas</th><th>🔵 Azul</th><th>🔴 Vermelho</th><th>Vencedor</th><th></th>' +
    '</tr></thead><tbody>';
  for(var i=0;i<rodadas.length;i++){
    var rod = rodadas[i];
    var vencedor = "";
    if(rod.pontosA > rod.pontosB) vencedor = "🏆 Azul";
    else if(rod.pontosB > rod.pontosA) vencedor = "🏆 Vermelho";
    else if(rod.pontosA === 0 && rod.pontosB === 0) vencedor = "—";
    else vencedor = "🤝 Empate";
    html += '<tr onclick="verDetalheRodada(\'' + rod.rodadaId + '\')">' +
      '<td>' + formatarData(rod.data) + '</td>' +
      '<td>' + rod.turma + '</td>' +
      '<td>' + rod.registros.length + '</td>' +
      '<td style="color:#0d47a1;font-weight:bold">' + rod.pontosA + '</td>' +
      '<td style="color:#b71c1c;font-weight:bold">' + rod.pontosB + '</td>' +
      '<td>' + vencedor + '</td>' +
      '<td class="ver-mais">👁️ Ver</td>' +
      '</tr>';
  }
  html += '</tbody></table></div>';
  return html;
}

function agruparPorRodada(registros){
  var grupos = {};
  for(var i=0;i<registros.length;i++){
    var r = registros[i];
    var chave = r.rodadaId || r.id;
    if(!grupos[chave]){
      grupos[chave] = {
        rodadaId: chave, data: r.data, turma: r.turma, disc: r.disc,
        registros: [], timeA: [], timeB: [], pontosA: 0, pontosB: 0
      };
    }
    grupos[chave].registros.push(r);
    if(r.time === "A") grupos[chave].timeA.push(r);
    else if(r.time === "B") grupos[chave].timeB.push(r);
    if(r.acertou && !r.interrompida){
      if(r.time === "A") grupos[chave].pontosA++;
      else grupos[chave].pontosB++;
    }
    if(r.data > grupos[chave].data) grupos[chave].data = r.data;
  }
  var arr = [];
  for(var k in grupos) arr.push(grupos[k]);
  arr.sort(function(a,b){ return b.data.localeCompare(a.data); });
  return arr;
}

function verDetalheRodada(rodadaId){
  var regs = [];
  for(var i=0;i<REGISTROS.length;i++){
    var chave = REGISTROS[i].rodadaId || REGISTROS[i].id;
    if(chave === rodadaId) regs.push(REGISTROS[i]);
  }
  if(regs.length === 0){ alert("Rodada não encontrada."); return; }
  regs.sort(function(a,b){ return a.data.localeCompare(b.data); });

  var turma = regs[0].turma;
  var disc = regs[0].disc;
  var dataInicio = regs[0].data;
  var dataFim = regs[regs.length-1].data;

  var timeARegs = [];
  var timeBRegs = [];
  var pontosA = 0, pontosB = 0;
  for(var j=0;j<regs.length;j++){
    if(regs[j].time === "A"){
      timeARegs.push(regs[j]);
      if(regs[j].acertou && !regs[j].interrompida) pontosA++;
    } else if(regs[j].time === "B"){
      timeBRegs.push(regs[j]);
      if(regs[j].acertou && !regs[j].interrompida) pontosB++;
    }
  }

  var html = '<div class="modal-box detalhe-box">' +
    '<div class="icone">🎮</div>' +
    '<h2>DETALHES DA RODADA</h2>' +
    '<div class="detalhe-header">' +
    '🏫 <b>Turma:</b> ' + turma + ' &nbsp;&nbsp;|&nbsp;&nbsp; 📚 <b>Disciplina:</b> ' + disc + '<br>' +
    '📅 <b>Início:</b> ' + formatarData(dataInicio) + '<br>' +
    '📅 <b>Fim:</b> ' + formatarData(dataFim) + '<br>' +
    '👥 <b>Total de partidas:</b> ' + regs.length +
    '</div>' +
    '<div class="detalhe-times">' +
    '<div class="detalhe-time a">' +
    '<h3>🔵 TIME AZUL</h3>' +
    '<div class="pontos">' + pontosA + ' ponto(s)</div>';
  if(timeARegs.length === 0){
    html += '<div style="text-align:center;font-size:12px;opacity:.7;padding:10px">Nenhum registro</div>';
  } else {
    for(var a=0;a<timeARegs.length;a++){
      var r = timeARegs[a];
      var resTxt = r.interrompida ? "⏸️ Interrompida" : (r.acertou ? "✔ " + r.erros + " erro(s)" : "✘ " + r.erros + " erro(s)");
      var resCls = r.interrompida ? "int" : (r.acertou ? "ok" : "no");
      html += '<div class="aluno-det">' +
        '<span class="nome">' + r.aluno + '</span>' +
        '<span class="res ' + resCls + '">' + resTxt + '</span>' +
        '</div>';
    }
  }
  html += '</div>' +
    '<div class="detalhe-time b">' +
    '<h3>🔴 TIME VERMELHO</h3>' +
    '<div class="pontos">' + pontosB + ' ponto(s)</div>';
  if(timeBRegs.length === 0){
    html += '<div style="text-align:center;font-size:12px;opacity:.7;padding:10px">Nenhum registro</div>';
  } else {
    for(var b=0;b<timeBRegs.length;b++){
      var r = timeBRegs[b];
      var resTxt = r.interrompida ? "⏸️ Interrompida" : (r.acertou ? "✔ " + r.erros + " erro(s)" : "✘ " + r.erros + " erro(s)");
      var resCls = r.interrompida ? "int" : (r.acertou ? "ok" : "no");
      html += '<div class="aluno-det">' +
        '<span class="nome">' + r.aluno + '</span>' +
        '<span class="res ' + resCls + '">' + resTxt + '</span>' +
        '</div>';
    }
  }
  html += '</div>' +
    '</div>';

  var vencedorTxt = "";
  if(pontosA > pontosB) vencedorTxt = "🏆 VENCEDOR: TIME AZUL!";
  else if(pontosB > pontosA) vencedorTxt = "🏆 VENCEDOR: TIME VERMELHO!";
  else if(pontosA === 0 && pontosB === 0) vencedorTxt = "🤝 Nenhum ponto";
  else vencedorTxt = "🤝 EMPATE!";
  html += '<div style="background:rgba(232,184,58,.3);padding:14px;border-radius:12px;margin-bottom:14px;font-weight:bold;font-size:16px">' +
    vencedorTxt +
    '</div>' +
    '<button class="btn btn-madeira" onclick="fecharModal()">⬅️ FECHAR</button>' +
    '</div>';

  abrirModal(html);
}

/* ============================================================
   EXPORTAÇÃO AVANÇADA
   ============================================================ */
function gerarCSVCompleto(lista){
  var csv = "Data/Hora;Aluno;Time;Turma;Disciplina;Palavra;Resultado;Erros\n";
  for(var i=0;i<lista.length;i++){
    var r = lista[i];
    var timeTxt = r.time === "A" ? "Azul" : (r.time === "B" ? "Vermelho" : "");
    var resultado = r.interrompida ? "Interrompida" : (r.acertou ? "Acertou" : "Errou");
    csv += '"' + formatarData(r.data) + '";' +
      '"' + r.aluno.replace(/"/g,'""') + '";' +
      '"' + timeTxt + '";' +
      '"' + r.turma + '";' +
      '"' + r.disc + '";' +
      '"' + r.palavra + '";' +
      '"' + resultado + '";' +
      r.erros + '\n';
  }
  return csv;
}

function gerarCSVNotas(lista){
  var porAluno = {};
  for(var i=0;i<lista.length;i++){
    var r = lista[i];
    if(!porAluno[r.aluno]){
      porAluno[r.aluno] = {nome: r.aluno, turma: r.turma, total: 0, acertos: 0, erros: 0, interrompidas: 0, errosLetras: 0};
    }
    var a = porAluno[r.aluno];
    a.total++;
    if(r.interrompida) a.interrompidas++;
    else if(r.acertou) a.acertos++;
    else a.erros++;
    a.errosLetras += r.erros;
  }
  var arr = [];
  for(var k in porAluno) arr.push(porAluno[k]);
  arr.sort(function(a,b){ return a.nome.localeCompare(b.nome); });

  var csv = "Aluno;Turma;Partidas;Acertos;Erros;Interrompidas;Aproveitamento(%);Erros em Letras;Desempenho\n";
  for(var j=0;j<arr.length;j++){
    var a = arr[j];
    var validas = a.acertos + a.erros;
    var aprov = validas > 0 ? Math.round(a.acertos/validas*100) : 0;
    var nota = "";
    if(validas === 0) nota = "—";
    else if(aprov >= 90) nota = "Excelente";
    else if(aprov >= 70) nota = "Bom";
    else if(aprov >= 50) nota = "Regular";
    else nota = "Atenção";

    csv += '"' + a.nome.replace(/"/g,'""') + '";' +
      '"' + a.turma + '";' +
      a.total + ";" +
      a.acertos + ";" +
      a.erros + ";" +
      a.interrompidas + ";" +
      aprov + ";" +
      a.errosLetras + ";" +
      '"' + nota + '"\n';
  }
  return csv;
}

function gerarCSVPorData(lista){
  var porData = {};
  for(var i=0;i<lista.length;i++){
    var r = lista[i];
    var dia = dataParaInput(r.data);
    if(!porData[dia]){
      porData[dia] = {dia: dia, total: 0, acertos: 0, erros: 0, alunos: [], turmas: []};
    }
    var d = porData[dia];
    d.total++;
    if(!r.interrompida){
      if(r.acertou) d.acertos++;
      else d.erros++;
    }
    if(d.alunos.indexOf(r.aluno) === -1) d.alunos.push(r.aluno);
    if(d.turmas.indexOf(r.turma) === -1) d.turmas.push(r.turma);
  }
  var arr = [];
  for(var k in porData) arr.push(porData[k]);
  arr.sort(function(a,b){ return b.dia.localeCompare(a.dia); });

  var csv = "Data;Total de Partidas;Acertos;Erros;Aproveitamento(%);Alunos;Turmas\n";
  for(var j=0;j<arr.length;j++){
    var d = arr[j];
    var validas = d.acertos + d.erros;
    var aprov = validas > 0 ? Math.round(d.acertos/validas*100) : 0;
    var [ano, mes, dia] = d.dia.split("-");
    var dataBr = dia + "/" + mes + "/" + ano;
    csv += '"' + dataBr + '";' +
      d.total + ";" +
      d.acertos + ";" +
      d.erros + ";" +
      aprov + ";" +
      '"' + d.alunos.join(", ") + '";' +
      '"' + d.turmas.join(", ") + '"\n';
  }
  return csv;
}

function gerarCSVPorRodada(lista){
  var rodadas = agruparPorRodada(lista);
  var csv = "Rodada;Data/Hora;Turma;Disciplina;Partidas;Pontos Azul;Pontos Vermelho;Vencedor;Alunos Azul;Alunos Vermelho\n";
  for(var i=0;i<rodadas.length;i++){
    var rod = rodadas[i];
    var vencedor = "";
    if(rod.pontosA > rod.pontosB) vencedor = "Azul";
    else if(rod.pontosB > rod.pontosA) vencedor = "Vermelho";
    else if(rod.pontosA === 0 && rod.pontosB === 0) vencedor = "—";
    else vencedor = "Empate";

    var azul = [];
    for(var a=0;a<rod.timeA.length;a++) azul.push(rod.timeA[a].aluno);
    var verm = [];
    for(var b=0;b<rod.timeB.length;b++) verm.push(rod.timeB[b].aluno);

    csv += '"' + rod.rodadaId + '";' +
      '"' + formatarData(rod.data) + '";' +
      '"' + rod.turma + '";' +
      '"' + rod.disc + '";' +
      rod.registros.length + ";" +
      rod.pontosA + ";" +
      rod.pontosB + ";" +
      '"' + vencedor + '";' +
      '"' + azul.join(", ") + '";' +
      '"' + verm.join(", ") + '"\n';
  }
  return csv;
}

function exportarCSVAtual(){
  var lista = filtrarRegistros();
  if(lista.length === 0){ alert("Nenhum registro para exportar!"); return; }
  var csv = "";
  var nome = "";
  var hoje = new Date().toISOString().slice(0,10);

  if(exportAba === "tabela"){
    csv = gerarCSVCompleto(lista);
    nome = "registros_completos_" + hoje + ".csv";
  } else if(exportAba === "notas"){
    csv = gerarCSVNotas(lista);
    nome = "notas_por_aluno_" + hoje + ".csv";
  } else if(exportAba === "data"){
    csv = gerarCSVPorData(lista);
    nome = "resumo_por_data_" + hoje + ".csv";
  } else if(exportAba === "rodadas"){
    csv = gerarCSVPorRodada(lista);
    nome = "resumo_por_rodada_" + hoje + ".csv";
  }
  baixarArquivo(nome, csv);
}

function copiarAtual(){
  var lista = filtrarRegistros();
  if(lista.length === 0){ alert("Nenhum registro para copiar!"); return; }
  var csv = "";
  if(exportAba === "tabela") csv = gerarCSVCompleto(lista);
  else if(exportAba === "notas") csv = gerarCSVNotas(lista);
  else if(exportAba === "data") csv = gerarCSVPorData(lista);
  else if(exportAba === "rodadas") csv = gerarCSVPorRodada(lista);
  copiarParaClipboard(csv.replace(/;/g, "\t"));
}

function mudarAbaProf(aba){ telaProfAba = aba; telaProfessor(); }

function renderConteudoProf(){
  var el = $("conteudoProf");
  if(telaProfAba === "add"){
    var turmas = getTurmas();
    var optsTurma = "";
    for(var i=0;i<turmas.length;i++){
      optsTurma += '<option value="' + turmas[i] + '">' + turmas[i] + '</option>';
    }
    el.innerHTML = '<label>Turma</label>' +
      '<input type="text" id="inputTurma" placeholder="Ex: 4º Ano" value="' + (turmas[0] || "") + '" list="listaTurmas">' +
      '<datalist id="listaTurmas">' + optsTurma + '</datalist>' +
      '<label>Disciplina</label>' +
      '<input type="text" id="inputDisc" placeholder="Ex: Química" value="Química">' +
      '<label>Palavra (pode ter acento)</label>' +
      '<input type="text" id="inputPalavra" placeholder="Ex: MOLÉCULA">' +
      '<label>Dica</label>' +
      '<textarea id="inputDica" placeholder="Digite a dica aqui..."></textarea>' +
      '<button class="btn btn-verde" onclick="adicionarPalavra()">➕ ADICIONAR PALAVRA</button>' +
      '<button class="btn btn-azul" onclick="restaurarPadrao()" style="margin-top:8px">🔄 Restaurar palavras padrão</button>';
  } else {
    var html = '<div class="lista">';
    for(var i=0;i<PALAVRAS.length;i++){
      html += '<div class="item"><div><b>[' + PALAVRAS[i].turma + ']</b> ' + PALAVRAS[i].p + ' — <span style="opacity:.8">' + PALAVRAS[i].d.substring(0,50) + (PALAVRAS[i].d.length > 50 ? "..." : "") + '</span></div>' +
        '<button class="del" onclick="removerPalavra(' + i + ')">🗑️</button></div>';
    }
    if(PALAVRAS.length === 0) html += '<p style="text-align:center;padding:20px">Nenhuma palavra cadastrada.</p>';
    html += '</div>';
    el.innerHTML = html;
  }
}

function adicionarPalavra(){
  var turma = $("inputTurma").value.trim();
  var disc = $("inputDisc").value.trim();
  var palavra = $("inputPalavra").value.trim().toUpperCase();
  var dica = $("inputDica").value.trim();
  if(!turma || !disc || !palavra || !dica){
    alert("Preencha todos os campos!");
    return;
  }
  PALAVRAS.push({turma:turma, disc:disc, p:palavra, d:dica});
  salvarPalavras();
  alert("✅ Palavra adicionada!");
  telaProfessor();
}

function removerPalavra(i){
  if(!confirm("Remover esta palavra?")) return;
  PALAVRAS.splice(i, 1);
  salvarPalavras();
  telaProfessor();
}

function restaurarPadrao(){
  if(!confirm("Isso vai APAGAR todas as palavras customizadas e restaurar as padrão. Continuar?")) return;
  PALAVRAS = PALAVRAS_PADRAO.slice();
  salvarPalavras();
  alert("🔄 Palavras restauradas!");
  telaProfessor();
}
